<!DOCTYPE html>
<!--
  Template for public/og-image.png (1200x630).
  The image is a committed static asset. To refresh it, open this file in a browser
  with a 1200x630 viewport and save a screenshot over public/og-image.png, e.g.
    agent-browser open "file://$PWD/scripts/og-image.html"
    agent-browser set viewport 1200 630
    agent-browser screenshot public/og-image.png
  The old sharp-based generator could not load the web fonts, hence the browser render.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG image template</title>
    <style>
      @font-face {
        font-family: 'Sofia Sans Condensed';
        font-weight: 1 1000;
        src: url('../node_modules/@fontsource-variable/sofia-sans-condensed/files/sofia-sans-condensed-latin-wght-normal.woff2')
          format('woff2');
      }

      @font-face {
        font-family: 'Sofia Sans';
        font-weight: 1 1000;
        src: url('../node_modules/@fontsource-variable/sofia-sans/files/sofia-sans-latin-wght-normal.woff2')
          format('woff2');
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b0f15;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 64px 72px;
        color: #f6f8fa;
        background:
          linear-gradient(90deg, rgba(5, 10, 18, 0.82) 0%, rgba(5, 10, 18, 0.5) 42%, rgba(5, 10, 18, 0) 72%),
          linear-gradient(180deg, rgba(5, 10, 18, 0) 45%, rgba(5, 10, 18, 0.7) 100%),
          url('../public/images/camp-dusk-landscape-1920.jpg') -40px -230px / 1800px auto no-repeat;
      }

      h1 {
        max-width: 620px;
        font-family: 'Sofia Sans Condensed', sans-serif;
        font-size: 118px;
        font-weight: 800;
        line-height: 0.94;
        letter-spacing: 0.005em;
        text-transform: uppercase;
      }

      p {
        margin-top: 24px;
        max-width: 520px;
        font-family: 'Sofia Sans', sans-serif;
        font-size: 31px;
        line-height: 1.3;
        color: rgba(246, 248, 250, 0.86);
      }

      .accent {
        width: 96px;
        height: 8px;
        margin-bottom: 30px;
        border-radius: 999px;
        background: #e66c37;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="accent"></div>
      <h1>Ceko's Camping Checklist</h1>
      <p>Phone-friendly packing checklist with progress tracking.</p>
    </div>
  </body>
</html>
