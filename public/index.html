<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="canonical" href="https://palatki.netlify.app/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Phone-friendly camping packing checklist with progress tracking."
    />
    <meta name="theme-color" content="#0b0f15" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
    <!-- Hero photo: keep in sync with src/components/hero/hero.component.tsx -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(min-width: 1024px)"
      imagesrcset="
        %PUBLIC_URL%/images/camp-dusk-portrait-720.avif   720w,
        %PUBLIC_URL%/images/camp-dusk-portrait-1080.avif 1080w,
        %PUBLIC_URL%/images/camp-dusk-portrait-1440.avif 1440w
      "
      imagesizes="max(38vw, 75vh)"
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(max-width: 1023.98px)"
      imagesrcset="
        %PUBLIC_URL%/images/camp-dusk-landscape-640.avif   640w,
        %PUBLIC_URL%/images/camp-dusk-landscape-960.avif   960w,
        %PUBLIC_URL%/images/camp-dusk-landscape-1440.avif 1440w,
        %PUBLIC_URL%/images/camp-dusk-landscape-1920.avif 1920w
      "
      imagesizes="100vw"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:title" content="Ceko's Camping Checklist" />
    <meta
      property="og:description"
      content="Phone-friendly camping packing checklist with progress tracking."
    />
    <meta property="og:image" content="https://palatki.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://palatki.netlify.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ceko's Camping Checklist" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ceko's Camping Checklist" />
    <meta
      name="twitter:description"
      content="Phone-friendly camping packing checklist with progress tracking."
    />
    <meta name="twitter:image" content="https://palatki.netlify.app/og-image.png" />

    <title>Ceko's Camping Checklist</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Ceko's Camping Checklist",
        "url": "https://palatki.netlify.app/",
        "description": "Phone-friendly camping packing checklist with progress tracking.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any"
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
